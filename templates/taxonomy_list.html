{% extends "base.html" %}

{% block title %}Темы — {{ config.title }}{% endblock title %}

{% block content %}
<header class="page-head">
    <h1 class="page-head__title">Все темы</h1>
</header>
{% if terms | length > 0 %}
<ul class="tag-list">
    {% for term in terms %}
    <li><a class="tag" href="{{ term.permalink | safe }}">{{ term.name }}<span class="tag__count">{{ term.page_count }}</span></a></li>
    {% endfor %}
</ul>
{% else %}
<p class="feed-empty">Тем пока нет.</p>
{% endif %}
{% endblock content %}
