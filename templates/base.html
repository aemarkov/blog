<!DOCTYPE html>
<html lang="{{ lang }}">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ config.title }}{% endblock title %}</title>
    <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preload" href="/fonts/golos-text-cyrillic-normal-400-f57bdd.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/source-serif-4-cyrillic-normal-400-4948e9.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/style.css">
    {% block head %}{% endblock head %}
</head>

<body>
    {% include "partials/header.html" %}
    <main class="page">
        {% block content %}{% endblock content %}
    </main>
    {% include "partials/footer.html" %}
    {% block scripts %}{% endblock scripts %}
</body>

</html>
