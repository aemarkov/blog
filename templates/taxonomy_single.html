{% extends "base.html" %}


{% block content %}
<h1>Статьи по тегу: {{ term.name }}</h1>

{% if term.pages | length > 0 %}
    <div class="posts">
        {% for post in term.pages %}
        {{<post_item post={post}/>}}
        {% endfor %}
    </div>
{% else %}
    <p>Нет записей</p>
{% endif %}
{% endblock content %}
