# The URL the site will be built for
base_url = "https://aemarkov.me"

title = "Записки охотника за сегфолтами"
description = "Заметки о программировании, инженерии и не только"
default_language = "en"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

# Enable taxonomies
taxonomies = [
    { name = "tags", feed = false }
]

[markdown]
insert_anchor_links = "right"
# Syntax highlighting uses the design palette (highlight/segfault.json)
[markdown.highlighting]
theme = "segfault"
extra_themes = ["highlight/segfault.json"]
data_attr_position = "pre"

[extra]
# Put all your custom variables here
author = "Алексей Марков"

# Contact links: shown on the About page; those flagged `footer` also in the site footer
[[extra.contacts]]
label = "GitHub"
handle = "github.com/aemarkov"
href = "https://github.com/aemarkov"
icon = "/icons/github.svg"

[[extra.contacts]]
label = "LinkedIn"
handle = "in/markov-alexey"
href = "https://www.linkedin.com/in/markov-alexey/"
icon = "/icons/linkedin.svg"

[[extra.contacts]]
label = "Telegram"
handle = "@markovalex95"
href = "https://t.me/markovalex95"
icon = "/icons/telegram.svg"
footer = true

[[extra.contacts]]
label = "Почта"
handle = "markovalex95@gmail.com"
href = "mailto:markovalex95@gmail.com"
icon = "/icons/mail.svg"

[slugify]
taxonomies = "off"

[languages.ru]
taxonomies = [
    { name = "tags", feed = false }
]

[languages.ru.translations]
[translations]
